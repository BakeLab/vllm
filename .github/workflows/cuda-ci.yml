name: CUDA CI

on:
  push:
    branches: [trim]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuda-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    if: github.repository == 'BakeLab/vllm'
    runs-on: [self-hosted, linux, x64, bb, cuda]
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Build current commit using the existing test image
        run: |
          docker info
          docker buildx version
          nvidia-smi
          cuda_arch_list=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | sort -u | paste -sd ' ' -)
          [[ "$cuda_arch_list" =~ ^[0-9]+\.[0-9]+(\ [0-9]+\.[0-9]+)*$ ]]
          docker buildx build --load --file docker/Dockerfile --target test \
            --build-arg "torch_cuda_arch_list=$cuda_arch_list" \
            --build-arg max_jobs=4 --build-arg nvcc_threads=2 \
            --build-arg PYTORCH_NIGHTLY=1 --build-arg VLLM_USE_PRECOMPILED=0 \
            --tag "vllm-cuda-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" .

      - name: Run existing CUDA kernel tests
        timeout-minutes: 90
        run: |
          docker run --name "vllm-cuda-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --gpus all --shm-size=8g --workdir /vllm-workspace \
            "vllm-cuda-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" bash -euc '
              uv venv --system-site-packages .venv
              .venv/bin/python -c "import torch; torch.cuda.init(); x = torch.ones(16, device=\"cuda\"); torch.testing.assert_close(x + x, torch.full_like(x, 2)); torch.cuda.synchronize()"
              .venv/bin/python -m pytest -v \
                tests/kernels/core/test_activation.py \
                tests/kernels/core/test_layernorm.py \
                tests/kernels/core/test_rotary_embedding.py \
                --junitxml=/tmp/cuda-ci.xml
            '

      - name: Collect test report
        if: always()
        run: |
          mkdir -p cuda-ci-results
          container="vllm-cuda-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker container inspect "$container" > /dev/null 2>&1; then
            docker cp "$container:/tmp/cuda-ci.xml" cuda-ci-results/ || true
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cuda-ci-results
          path: cuda-ci-results/
          if-no-files-found: ignore

      - name: Clean up this job's container and image
        if: always()
        run: |
          docker rm -f "vllm-cuda-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null || true
          docker image rm "vllm-cuda-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null || true
