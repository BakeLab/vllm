name: CUDA CI

on:
  push:
    branches: [trim]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuda-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    if: github.repository == 'BakeLab/vllm' && github.server_url != 'https://github.com'
    runs-on: [self-hosted, linux, x64, bb, cuda]
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: vllm
          persist-credentials: false
          submodules: recursive

      - name: Checkout shared CI infrastructure
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: BakeLab/breadkernel
          ref: 551bee53ff70429c7abb8e83e5e280bd9a63211a
          path: .cuda-ci/infra
          persist-credentials: false

      - name: Prepare exact CUDA dependencies
        id: cuda
        uses: ./.cuda-ci/infra/.github/actions/cuda-env

      - name: Build vLLM and run its CUDA tests
        env:
          CONTAINER: ${{ steps.cuda.outputs.container }}
        run: |
          git -C vllm rev-parse HEAD > cuda-ci-results/vllm.sha
          docker exec --workdir /workspace/vllm "$CONTAINER" bash -euc '
            uv pip install --python /opt/venv/bin/python \
              -r requirements/build/cuda.txt -r requirements/cuda.txt -r requirements/test/cuda.in \
              --excludes /opt/cuda-ci/frameworks.txt
            CMAKE_ARGS="$CMAKE_ARGS -DVLLM_X86_BASELINE=x86-64-v3" \
              VLLM_USE_PRECOMPILED=0 uv pip install --python /opt/venv/bin/python \
              --no-build-isolation --no-deps -v -e .
            /opt/venv/bin/python -m pytest -v \
              tests/kernels/core/test_activation.py \
              tests/kernels/core/test_layernorm.py \
              tests/kernels/core/test_rotary_embedding.py \
              --junitxml=/workspace/cuda-ci-results/vllm.xml
          '

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cuda-ci-${{ github.sha }}
          path: cuda-ci-results/
          if-no-files-found: warn

      - name: Stop the build container
        if: always() && steps.cuda.outputs.container != ''
        env:
          CONTAINER: ${{ steps.cuda.outputs.container }}
        run: docker rm -f "$CONTAINER"
